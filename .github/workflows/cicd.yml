name: CI/CD - Spring Boot na OKE

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false   # NE otkazuj deploy u tijeku

env:
  OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
  OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
  OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
  OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
  OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
  OCIR_NAMESPACE: ${{ secrets.OCIR_NAMESPACE }}
  OCIR_REGION_KEY: fra                                     # Frankfurt; promijenite ako je druga regija
  OCIR_REPO: spring-projects/spring-boot-hello-app
  IMAGE_TAG: ${{ github.sha }}                             # imutabilan tag

jobs:

  build:
    name: Build, test and push image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: oracle
          java-version: '17'
          cache: maven                              # automatski Maven cache

      - name: Build with Maven (uključuje testove)
        run: ./mvnw -B package

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          if-no-files-found: error

      - name: Login to OCIR
        if: github.event_name == 'push'             # ne push iz PR-a (sigurnost)
        uses: oracle-actions/login-ocir@v1.3.0
        with:
          auth_token: ${{ secrets.OCI_AUTH_TOKEN }}

      - name: Build and push Docker image
        if: github.event_name == 'push'
        run: |
          IMAGE="${OCIR_REGION_KEY}.ocir.io/${OCIR_NAMESPACE}/${OCIR_REPO}"
          docker build -t "${IMAGE}:${IMAGE_TAG}" -t "${IMAGE}:latest" .
          docker push "${IMAGE}:${IMAGE_TAG}"
          docker push "${IMAGE}:latest"
          echo "IMAGE=${IMAGE}:${IMAGE_TAG}" >> $GITHUB_OUTPUT
        id: docker

  deploy:
    name: Deploy na OKE
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure kubectl za OKE
        uses: oracle-actions/configure-kubectl-oke@v1.5.0
        with:
          cluster: ${{ secrets.OKE_CLUSTER_OCID }}

      - name: Update image i apply manifest
        run: |
          IMAGE="${OCIR_REGION_KEY}.ocir.io/${OCIR_NAMESPACE}/${OCIR_REPO}:${IMAGE_TAG}"
          # Zamijeni placeholder u manifestu (ili koristi kustomize/helm za kompliciranije scenarije)
          sed -i "s|IMAGE_PLACEHOLDER|${IMAGE}|g" k8s/sbapp-deploy.yaml
          kubectl apply -f k8s/sbapp-deploy.yaml

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/sbapp --timeout=5m

      - name: Smoke test
        run: |
          EXT_IP=""
          for i in $(seq 1 30); do
            EXT_IP=$(kubectl get svc sbapp-lb -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || true)
            [ -n "${EXT_IP}" ] && break
            echo "Čekam Load Balancer IP... (${i}/30)"
            sleep 10
          done
          if [ -z "${EXT_IP}" ]; then
            echo "Load Balancer nije dobio IP u 5 minuta"
            exit 1
          fi
          echo "Aplikacija je na http://${EXT_IP}:8080/hostname"
          curl --fail --max-time 10 "http://${EXT_IP}:8080/hostname"
